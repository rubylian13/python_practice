<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Todo List</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            min-height: 100vh;
            padding-top: 60px;
            transition: background 0.2s linear;
        }

        /* 卡片 */
        .todo-card {
            background: #ffffffee;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            border-radius: 20px;
            padding: 30px;
        }

        .todo-item {
            background-color: white;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .todo-item:hover {
            background-color: #eef1ff;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }

        .btn-action {
            border-radius: 8px;
            padding: 3px 10px;
            font-size: 0.85rem;
        }

        /* 🌙 Dark Mode */
        body.dark {
            background: linear-gradient(135deg, #232526 0%, #414345 100%);
        }

        body.dark .todo-card {
            background: #2b2b2bdd;
            color: white;
        }

        body.dark .todo-item {
            background: #3a3a3a;
            color: white;
        }

        body.dark .todo-item:hover {
            background: #515151;
        }

        body.dark input,
        body.dark .form-control {
            background: #2e2e2e !important;
            color: white !important;
            border-color: #555;
        }

        body.dark .btn-primary {
            background: #6c5ce7;
            border: none;
        }

        /* Switch Button */
        .mode-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 1.4rem;
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- 右上角 Dark Mode 切換按鈕 -->
<button class="mode-btn" id="modeToggle">🌙</button>

<div class="container">
    <div class="col-md-6 mx-auto">

        <div class="todo-card">

            <h1 class="text-center mb-4">📝 My Todo List</h1>

            <!-- Add Todo -->
            <form method="POST" class="mb-4">
                <div class="input-group">
                    <input name="todo" type="text" class="form-control" placeholder="新增 Todo..." required>
                    <button class="btn btn-primary">新增</button>
                </div>
            </form>

            <!-- Todo List -->
            <ul class="list-group">
                {% for todo in todos %}
                <li class="list-group-item d-flex justify-content-between align-items-center todo-item">

                    <span class="{{ 'done' if todo.done }}">
                        {{ todo.text }}
                    </span>

                    <div>
                        <a href="/toggle/{{ todo.id }}" class="btn btn-success btn-action">✔</a>
                        <a href="/delete/{{ todo.id }}" class="btn btn-danger btn-action">✖</a>
                    </div>

                </li>
                {% endfor %}
            </ul>

        </div>
    </div>
</div>

<script>
    const body = document.body;
    const btn = document.getElementById("modeToggle");

    // 讀取模式
    if (localStorage.getItem("mode") === "dark") {
        body.classList.add("dark");
        btn.textContent = "☀️";
    }

    // 點擊切換
    btn.onclick = () => {
        body.classList.toggle("dark");
        const darkMode = body.classList.contains("dark");

        btn.textContent = darkMode ? "☀️" : "🌙";
        localStorage.setItem("mode", darkMode ? "dark" : "light");
    };
</script>

</body>
</html>
